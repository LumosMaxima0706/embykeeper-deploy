services:
  embykeeper:
    image: ${EMBYKEEPER_IMAGE:-embykeeper/embykeeper:v7.6.1}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    command:
      - /run/embykeeper-secrets/config.toml
      - --emby
      - --no-top
      - --disable-color
    volumes:
      - ./secrets/config.toml:/run/embykeeper-secrets/config.toml:ro
      - ./data:/app
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
